<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Học Liệu Số - Kiểm Tra Đánh Giá Năng Lực</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathStudent();"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { user-select: none; -webkit-user-select: none; }
        #loginScreen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 9998; display: flex; justify-content: center; align-items: center;
        }
        .login-card {
            background: #fff; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 450px;
        }
        #cheatWarning {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88); color: white; z-index: 9999;
            display: none; justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" onpaste="return false;">

<div id="loginScreen">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-graduation-cap text-primary fa-3x mb-2"></i>
            <h4 class="font-weight-bold text-dark">Cổng Học Liệu Số K-12</h4>
            <p class="text-muted small">Đăng nhập phòng thi trực tuyến</p>
        </div>
        <form onsubmit="handleStudentLogin(event)">
            <div class="form-group"><label class="small font-weight-bold">Số Báo Danh (SBD)</label><input type="text" class="form-control" id="loginSBD" required placeholder="Nhập SBD..."></div>
            <button type="submit" id="btnLogin" class="btn btn-primary btn-block font-weight-bold py-2 mt-4">VÀO PHÒNG THI</button>
        </form>
    </div>
</div>

<div id="cheatWarning">
    <div class="p-4">
        <i class="fas fa-exclamation-triangle text-warning display-1 mb-3"></i>
        <h2 class="text-danger font-weight-bold">CẢNH BÁO VI PHẠM QUY CHẾ THI!</h2>
        <p class="lead">Bạn vừa rời khỏi màn hình bài thi.</p>
        <p>Số lần vi phạm: <strong id="cheatCount" class="text-warning">1</strong> / 3</p>
        <button class="btn btn-primary btn-lg mt-3" onclick="resumeExam()">Tiếp tục làm bài</button>
    </div>
</div>

<div class="exam-header d-flex justify-content-between align-items-center" id="examHeader" style="display:none !important;">
    <div>
        <h5 class="m-0 font-weight-bold"><i class="fas fa-file-alt mr-2"></i> Bài Kiểm Tra Đánh Giá Năng Lực</h5>
        <small id="displayStudentInfo">Thí sinh: ...</small>
    </div>
    <div class="d-flex align-items-center">
        <div class="timer-box mr-3"><i class="fas fa-clock mr-1"></i> <span id="timer">45:00</span></div>
        <button class="btn btn-success btn-sm font-weight-bold" onclick="submitExam()"><i class="fas fa-paper-plane mr-1"></i> NỘP BÀI</button>
    </div>
</div>

<div class="container-fluid main-content" id="examMainContent" style="display:none; margin-top: 70px;">
    <div class="row">
        <div class="col-md-5">
            <div class="passage-box">
                <h6 class="text-primary font-weight-bold border-bottom pb-2"><i class="fas fa-book-open mr-1"></i> NGỮ LIỆU ĐỌC HIỂU</h6>
                <div id="examPassage" class="text-justify mt-3">Đang tải ngữ liệu...</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="question-box">
                <h6 class="font-weight-bold text-dark mb-3" id="currentQTitle">Câu hỏi</h6>
                <div id="examQuestionContent">Đang tải câu hỏi...</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white font-weight-bold"><i class="fas fa-th mr-1"></i> Danh sách câu hỏi</div>
                <div class="card-body"><div class="question-palette d-flex flex-wrap" id="questionPalette"></div></div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
    let currentStudent = null;
    let cheatViolations = 0;

    function renderMathStudent() {
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(document.body, {
                delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}]
            });
        }
    }

    function handleStudentLogin(e) {
        e.preventDefault();
        let sbd = $('#loginSBD').val();
        $('#btnLogin').text("Đang kiểm tra...").prop('disabled', true);
        fetch(`${API_URL}?action=studentLogin&sbd=${sbd}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    currentStudent = data.student;
                    $('#displayStudentInfo').text(`Thí sinh: ${currentStudent.name} - SBD: ${currentStudent.sbd} (Khối: ${currentStudent.grade})`);
                    $('#loginScreen').fadeOut(); $('#examHeader').show(); $('#examMainContent').show();
                    if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(err=>{}); }
                    loadExamQuestions();
                } else {
                    alert(data.message);
                    $('#btnLogin').text("VÀO PHÒNG THI").prop('disabled', false);
                }
            }).catch(err => { alert("Lỗi kết nối: " + err); $('#btnLogin').text("VÀO PHÒNG THI").prop('disabled', false); });
    }

    function loadExamQuestions() {
        fetch(`${API_URL}?action=getQuestions&grade=${currentStudent.grade}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success' && data.data.length > 0) {
                    $('#examPassage').html(data.data[0].passage || "Không có ngữ liệu.");
                    $('#examQuestionContent').html(data.data[0].question);
                    $('#questionPalette').html('<button class="btn btn-light btn-current">1</button>');
                    renderMathStudent();
                } else {
                    $('#examQuestionContent').html("<div class='alert alert-warning'>Chưa có câu hỏi cho khối lớp này!</div>");
                }
            });
    }

    document.addEventListener("visibilitychange", function() {
        if (document.hidden && $('#examMainContent').is(':visible')) { triggerAntiCheat(); }
    });

    function triggerAntiCheat() {
        cheatViolations++; $('#cheatCount').text(cheatViolations); $('#cheatWarning').css('display', 'flex');
        if (cheatViolations >= 3) { alert("Quá 3 lần vi phạm! Hệ thống tự động nộp bài."); submitExam(); }
    }
    function resumeExam() { $('#cheatWarning').hide(); }

    function submitExam() {
        if(!confirm("Bạn có chắc chắn muốn nộp bài thi?")) return;
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "submitExam",
                sbd: currentStudent.sbd,
                name: currentStudent.name,
                grade: currentStudent.grade,
                lop: currentStudent.session || "",
                score: 8.5,
                correctCount: 17,
                totalCount: 20,
                violations: cheatViolations
            })
        }).then(res => res.json()).then(data => {
            alert(data.message);
            location.reload();
        });
    }
</script>
</body>
</html>
