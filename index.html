<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Phòng Thi Trực Tuyến - K-12</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathStudent();"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { user-select: none; }
        #loginScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 9998; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        .question-palette button { width: 40px; height: 40px; margin: 4px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

<!-- ĐĂNG NHẬP THÍ SINH -->
<div id="loginScreen">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-graduation-cap text-primary fa-3x mb-2"></i>
            <h4 class="font-weight-bold text-dark">Cổng Kiểm Tra Đánh Giá Năng Lực</h4>
            <p class="text-muted small">Nhập số báo danh để vào phòng thi</p>
        </div>
        <form onsubmit="handleStudentLogin(event)">
            <div class="form-group">
                <label class="small font-weight-bold">Số Báo Danh (SBD)</label>
                <input type="text" class="form-control" id="loginSBD" required placeholder="Nhập SBD (VD: 10001)...">
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary btn-block font-weight-bold py-2 mt-4">VÀO PHÒNG THI</button>
        </form>
    </div>
</div>

<!-- HEADER BÀI THI -->
<div class="exam-header d-flex justify-content-between align-items-center" id="examHeader" style="display:none !important;">
    <div>
        <h5 class="m-0 font-weight-bold"><i class="fas fa-file-alt mr-2"></i> Bài Kiểm Tra Đánh Giá Năng Lực (Chuẩn 3 Phần)</h5>
        <small id="displayStudentInfo">Thí sinh: ...</small>
    </div>
    <div class="d-flex align-items-center">
        <div class="timer-box mr-3"><i class="fas fa-clock mr-1"></i> <span id="timer">90:00</span></div>
        <button class="btn btn-success btn-sm font-weight-bold px-3 py-2" onclick="submitExam()"><i class="fas fa-paper-plane mr-1"></i> NỘP BÀI</button>
    </div>
</div>

<!-- NỘI DUNG PHÒNG THI -->
<div class="container-fluid main-content" id="examMainContent" style="display:none; margin-top: 75px;">
    <div class="row">
        <!-- Cột 1: Ngữ liệu -->
        <div class="col-md-4">
            <div class="passage-box">
                <h6 class="text-primary font-weight-bold border-bottom pb-2"><i class="fas fa-book-open mr-1"></i> NGỮ LIỆU ĐỌC HIỂU / DỮ LIỆU CHUNG</h6>
                <div id="examPassage" class="text-justify mt-3 text-secondary">Đang tải ngữ liệu...</div>
            </div>
        </div>
        <!-- Cột 2: Nội dung câu hỏi -->
        <div class="col-md-5">
            <div class="question-box">
                <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                    <div>
                        <span class="badge badge-pill badge-danger px-3 py-1 mb-1 font-weight-bold" id="currentSectionBadge">Phần thi khảo thí</span>
                        <h6 class="font-weight-bold text-primary m-0" id="currentQHeading">Câu hỏi 1</h6>
                    </div>
                    <span class="badge badge-info" id="currentQLevel">Mức độ</span>
                </div>
                <div id="examQuestionContent">Đang tải câu hỏi...</div>
                
                <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                    <button class="btn btn-outline-secondary btn-sm font-weight-bold px-3" onclick="prevQuestion()"><i class="fas fa-chevron-left mr-1"></i> Câu trước</button>
                    <button class="btn btn-outline-primary btn-sm font-weight-bold px-3" onclick="nextQuestion()">Câu sau <i class="fas fa-chevron-right ml-1"></i></button>
                </div>
            </div>
        </div>
        <!-- Cột 3: Danh sách câu hỏi -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white font-weight-bold"><i class="fas fa-th mr-1"></i> Danh sách câu hỏi</div>
                <div class="card-body">
                    <div class="question-palette d-flex flex-wrap justify-content-start" id="questionPalette"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx-I67uayUEw7BzHsZ_9hpOLOVQDfqIvcc3Vd8sYtpkKKZUxI18F8mePuvWXNCslDOY/exec";
    let currentStudent = null;
    let examQuestions = [];
    let currentIndex = 0;
    let studentAnswers = {};

    function renderMathStudent() { if (typeof renderMathInElement !== 'undefined') renderMathInElement(document.body, {delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}]}); }

    function handleStudentLogin(e) {
        e.preventDefault();
        let sbd = $('#loginSBD').val().trim();
        fetch(`${API_URL}?action=studentLogin&sbd=${sbd}`).then(res => res.json()).then(data => {
            if(data.status === 'success') {
                currentStudent = data.student;
                $('#displayStudentInfo').text(`Thí sinh: ${currentStudent.name} - SBD: ${currentStudent.sbd}`);
                $('#loginScreen').fadeOut(); $('#examHeader').show(); $('#examMainContent').show();
                loadExamQuestions();
                startTimer(90 * 60);
            } else alert(data.message);
        });
    }

    function loadExamQuestions() {
        fetch(`${API_URL}?action=getQuestions&grade=${currentStudent.grade}`).then(res => res.json()).then(data => {
            if(data.status === 'success' && data.data.length > 0) {
                // TỰ ĐỘNG PHÂN LOẠI CHUẨN XÁC DỰA TRÊN THỰC TẾ OPTIONS CỦA CÂU HỎI
                let p1 = [], p2 = [], p3 = [];

                data.data.forEach(q => {
                    let hasABCD = q.options && typeof q.options === 'object' && (q.options['A'] || q.options['B']);
                    let hasAbcd = q.options && typeof q.options === 'object' && (q.options['a'] || q.options['b']);

                    if (q.type === 'DUNG_SAI' || hasAbcd) {
                        q._detectedType = 'DUNG_SAI';
                        p2.push(q);
                    } else if (q.type === 'TRA_LOI_NGAN' || !hasABCD) {
                        q._detectedType = 'TRA_LOI_NGAN';
                        p3.push(q);
                    } else {
                        q._detectedType = 'TRAC_NGHIEM';
                        p1.push(q);
                    }
                });

                // SẮP XẾP ĐÚNG CẤU TRÚC 3 PHẦN: PHẦN 1 -> PHẦN 2 -> PHẦN 3
                examQuestions = [...p1, ...p2, ...p3];

                renderQuestion(0);
                renderPalette();
            } else {
                $('#examQuestionContent').html("<div class='alert alert-warning'>Chưa có câu hỏi cho khối lớp này!</div>");
            }
        });
    }

    function renderQuestion(index) {
        if (index < 0 || index >= examQuestions.length) return;
        currentIndex = index;
        let q = examQuestions[currentIndex];
        let type = q._detectedType || 'TRAC_NGHIEM';

        let sectionTitle = "Phần 1: Trắc nghiệm nhiều lựa chọn (4 phương án)";
        if (type === 'DUNG_SAI') sectionTitle = "Phần 2: Trắc nghiệm Đúng / Sai (4 ý a, b, c, d)";
        else if (type === 'TRA_LOI_NGAN') sectionTitle = "Phần 3: Trắc nghiệm trả lời ngắn (Điền đáp án)";

        $('#currentSectionBadge').text(sectionTitle);
        $('#currentQHeading').text(`Câu hỏi ${currentIndex + 1}`);
        $('#currentQLevel').text(q.level || "Thông hiểu");
        $('#examPassage').html(q.passage || "Không có ngữ liệu bổ trợ.");

        let htmlContent = `<div class="mb-3 font-weight-bold text-dark" style="font-size: 1.02rem;">${q.question}</div>`;

        if (type === 'DUNG_SAI') {
            let subStatements = q.options && typeof q.options === 'object' ? q.options : { "a": "Nhận định a", "b": "Nhận định b", "c": "Nhận định c", "d": "Nhận định d" };
            if(!studentAnswers[currentIndex]) studentAnswers[currentIndex] = {};

            htmlContent += `<div class="table-responsive mt-3"><table class="table table-bordered table-sm text-center">
                <thead class="thead-light"><tr><th class="text-left">Ý phát biểu</th><th>Đúng</th><th>Sai</th></tr></thead><tbody>`;
            for (let key in subStatements) {
                let val = studentAnswers[currentIndex][key] || '';
                htmlContent += `
                    <tr>
                        <td class="text-left align-middle"><strong>${key})</strong> ${subStatements[key]}</td>
                        <td class="align-middle"><input type="radio" name="ds_${key}" value="D" ${val==='D'?'checked':''} onclick="saveTF('${key}', 'D')"></td>
                        <td class="align-middle"><input type="radio" name="ds_${key}" value="S" ${val==='S'?'checked':''} onclick="saveTF('${key}', 'S')"></td>
                    </tr>`;
            }
            htmlContent += `</tbody></table></div>`;
        } 
        else if (type === 'TRA_LOI_NGAN') {
            let val = studentAnswers[currentIndex] || '';
            htmlContent += `
                <div class="mt-4">
                    <label class="small font-weight-bold text-muted"><i class="fas fa-pen-nib mr-1"></i> Nhập kết quả trả lời ngắn:</label>
                    <input type="text" class="form-control form-control-lg text-primary font-weight-bold" placeholder="Nhập đáp số (VD: 0,08)..." value="${val}" oninput="saveShort(this.value)">
                </div>`;
        } 
        else {
            // Phần 1: Trắc nghiệm 4 đáp án A, B, C, D
            let opts = q.options || { "A": "Phương án A", "B": "Phương án B", "C": "Phương án C", "D": "Phương án D" };
            htmlContent += `<div class="list-options mt-3">`;
            for (let key in opts) {
                if(!opts[key]) continue;
                let isChecked = studentAnswers[currentIndex] === key ? 'checked' : '';
                htmlContent += `
                    <div class="custom-control custom-radio mb-2 p-2 bg-light rounded border">
                        <input type="radio" id="opt_${key}" name="studentAnswer" class="custom-control-input" value="${key}" ${isChecked} onclick="saveMC('${key}')">
                        <label class="custom-control-label font-weight-normal ml-2" for="opt_${key}" style="cursor: pointer; width: 100%;">
                            <strong class="text-primary mr-2">${key}.</strong> ${opts[key]}
                        </label>
                    </div>`;
            }
            htmlContent += `</div>`;
        }

        $('#examQuestionContent').html(htmlContent);
        renderMathStudent();
        updatePaletteActive();
    }

    function saveMC(val) { studentAnswers[currentIndex] = val; updatePaletteStatus(); }
    function saveTF(key, val) { if(!studentAnswers[currentIndex]) studentAnswers[currentIndex] = {}; studentAnswers[currentIndex][key] = val; updatePaletteStatus(); }
    function saveShort(val) { studentAnswers[currentIndex] = val; updatePaletteStatus(); }

    function nextQuestion() { if (currentIndex < examQuestions.length - 1) renderQuestion(currentIndex + 1); }
    function prevQuestion() { if (currentIndex > 0) renderQuestion(currentIndex - 1); }

    function renderPalette() {
        let paletteHtml = '';
        for (let i = 0; i < examQuestions.length; i++) {
            paletteHtml += `<button class="btn btn-outline-secondary btn-sm m-1" id="palette_${i}" onclick="renderQuestion(${i})">${i + 1}</button>`;
        }
        $('#questionPalette').html(paletteHtml);
        updatePaletteActive();
    }

    function updatePaletteActive() {
        $('.question-palette button').removeClass('btn-primary btn-outline-secondary btn-success').addClass('btn-outline-secondary');
        $(`#palette_${currentIndex}`).removeClass('btn-outline-secondary').addClass('btn-primary text-white');
        for(let i in studentAnswers) {
            if(studentAnswers[i] && (typeof studentAnswers[i] === 'string' && studentAnswers[i] !== '' || Object.keys(studentAnswers[i]).length > 0)) {
                $(`#palette_${i}`).removeClass('btn-outline-secondary btn-primary').addClass('btn-success text-white');
            }
        }
        $(`#palette_${currentIndex}`).removeClass('btn-success').addClass('btn-primary text-white');
    }

    function updatePaletteStatus() { updatePaletteActive(); }

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        setInterval(function () {
            minutes = parseInt(timer / 60, 10); seconds = parseInt(timer % 60, 10);
            $('#timer').text((minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds));
            if (--timer < 0) submitExam();
        }, 1000);
    }

    function submitExam() {
        if(!confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        let answeredCount = Object.keys(studentAnswers).filter(k => studentAnswers[k]).length;
        let score = (answeredCount / examQuestions.length * 10).toFixed(2);
        fetch(API_URL, {method: 'POST', body: JSON.stringify({action: "submitExam", sbd: currentStudent.sbd, name: currentStudent.name, grade: currentStudent.grade, score: parseFloat(score)})})
            .then(res => res.json()).then(data => { alert(data.message); location.reload(); });
    }
</script>
</body>
</html>
